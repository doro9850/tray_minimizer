[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tray-minimizer"
version = "1.0.1"
description = "선택한 프로세스의 창을 최소화하면 트레이 아이콘으로 보내는 Windows 프로그램"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "psutil>=5.9",
]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[project.gui-scripts]
tray-minimizer = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]
